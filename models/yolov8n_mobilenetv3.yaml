# Exp1: YOLOv8n + MobileNetV3 backbone
# No CA, Alpha-IoU, or P2 small-object head is included in this experiment.

nc: 4
scales:
  n: [0.50, 0.25, 1024]

# TorchVision MobileNetV3-Small feature stages:
# P3 = 80x80, P4 = 40x40, P5 = 20x20 for a 640x640 input.
backbone:
  # truncate=2 removes MobileNetV3's avgpool and classifier layers.
  - [-1, 1, TorchVision, [576, mobilenet_v3_small, DEFAULT, True, 2, True]]
  # TorchVision split output starts with the original input at index 0.
  - [0, 1, Index, [24, 3]]
  - [0, 1, Index, [48, 8]]
  - [0, 1, Index, [576, 13]]

head:
  - [3, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [[10, 13, 16], 1, Detect, [nc]]
