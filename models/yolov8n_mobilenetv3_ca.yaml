# Exp2: YOLOv8n + MobileNetV3 + Coordinate Attention
# MobileNetV3 SE blocks are replaced by CA in the registered MobileNetV3CA module.

nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, MobileNetV3CA, [576, mobilenet_v3_small, DEFAULT, True, 2, True]]
  - [0, 1, Index, [24, 3]]
  - [0, 1, Index, [48, 8]]
  - [0, 1, Index, [576, 13]]

head:
  - [3, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [[10, 13, 16], 1, Detect, [nc]]
